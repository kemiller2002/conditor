name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every job runs on pull requests as well as on main, so each check a merge
# gate reads on a PR head has run and concluded (WI-0036); no job is push-only.
concurrency:
  group: conditor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Conditor.Tests --configuration Release --no-build
      - name: CLI plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- presets
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- components
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- components --json > "$RUNNER_TEMP/conditor-components.json"
          grep -F '"id": "praxis"' "$RUNNER_TEMP/conditor-components.json"
          grep -F '"id": "tutela"' "$RUNNER_TEMP/conditor-components.json"
          python3 - "$RUNNER_TEMP/conditor-components.json" <<'PY'
          import json, sys
          inventory = {item["id"]: item for item in json.load(open(sys.argv[1]))["components"]}
          limen = inventory["limen"]
          assert limen["package"] == "@echelon-foundry/limen", limen
          assert limen["defaultVersion"] == "0.9.0", limen
          assert limen["qualifiedVersions"] == ["0.6.1", "0.6.2", "0.7.0", "0.7.1", "0.9.0"], limen
          assert limen["historicalPackages"] == [
              {"package": "@echelon-foundry/typescript-wasm-kernel", "versions": ["0.6.1", "0.6.2"]}
          ], limen
          forma = inventory["forma"]
          assert forma["package"] == "@echelon-foundry/design-system", forma
          assert forma["defaultVersion"] == "0.5.0", forma
          assert forma["qualifiedVersions"] == ["0.2.0", "0.3.0", "0.4.1", "0.5.0"], forma
          PY
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- compatibility
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- compatibility --json > "$RUNNER_TEMP/conditor-compatibility.json"
          grep -F '"schemaVersion": 1' "$RUNNER_TEMP/conditor-compatibility.json"
          grep -F '"id": "praxis"' "$RUNNER_TEMP/conditor-compatibility.json"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset clean-room --target "$RUNNER_TEMP/conditor-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- workstation plan --profile echelon-engineering --home "$RUNNER_TEMP/workstation-plan-home"
          test -z "$(ls -A "$RUNNER_TEMP/workstation-plan-home" 2>/dev/null)"
      - name: Component schema conformance (independent validator)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/schema-venv"
          "$RUNNER_TEMP/schema-venv/bin/pip" install --quiet --disable-pip-version-check 'jsonschema==4.26.0'
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- components --json > "$RUNNER_TEMP/conditor-components.json"
          "$RUNNER_TEMP/schema-venv/bin/python" - "$RUNNER_TEMP/conditor-components.json" components/*.component.json <<'PY'
          import json, sys
          from jsonschema import Draft202012Validator

          def validator(path):
              schema = json.load(open(path))
              Draft202012Validator.check_schema(schema)
              return Draft202012Validator(schema)

          component = validator("schemas/conditor-component.schema.json")
          inventory = validator("schemas/conditor-components.schema.json")
          failures = []
          for path in sys.argv[2:]:
              failures += [f"{path}: {error.message}" for error in component.iter_errors(json.load(open(path)))]
          failures += [f"components --json: {error.message}" for error in inventory.iter_errors(json.load(open(sys.argv[1])))]
          if len(sys.argv) < 3:
              failures.append("no component descriptors found")
          print("\n".join(failures) or f"{len(sys.argv) - 2} descriptors and the inventory conform to their schemas")
          sys.exit(1 if failures else 0)
          PY
      - name: Indy Init preset plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-indy-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset indy-init --target "$RUNNER_TEMP/conditor-indy-plan"

  ordo-integrity-gate-qualification:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.4.2 is the echelon-current 1.1.0 selection and the upgrade source;
        # 1.5.0 is the echelon-current 1.2.0 selection.
        ordo: ["1.4.2", "1.5.0"]
    env:
      ORDO_VERSION: ${{ matrix.ordo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Install exact native Ordo ${{ matrix.ordo }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version "$ORDO_VERSION"
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/ordo" --version | grep -Fx "$ORDO_VERSION"
      - name: Adoption records structural review signals and fails closed on integrity
        shell: bash
        run: |
          set -euo pipefail
          conditor() { dotnet run --project src/Conditor.Cli --configuration Release --no-build -- "$@"; }
          healthy="$RUNNER_TEMP/gate-healthy"
          damaged="$RUNNER_TEMP/gate-damaged"
          mkdir -p "$healthy/src"
          ( cd "$healthy" && ordo init )
          seq 1 2100 | sed 's/^/\/\/ line /' > "$healthy/src/Big.fs"
          cp -R "$healthy" "$damaged"
          echo "edited" >> "$damaged/.sde/reference/GLOSSARY.md"

          conditor adopt --target "$healthy" --json > "$RUNNER_TEMP/gate-healthy.json"
          python3 - "$RUNNER_TEMP/gate-healthy.json" "$ORDO_VERSION" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          assert plan["refusals"] == [], plan["refusals"]
          assert {"id": "ordo", "version": sys.argv[2]} in plan["components"], plan["components"]
          paths = [signal["path"] for signal in plan["reviewSignals"] if signal["code"] == "SDE-STRUCT-001"]
          assert paths == ["src/Big.fs"], plan["reviewSignals"]
          PY
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/gate-healthy.json")
          conditor adopt --target "$healthy" --authorize "$digest"
          python3 - "$healthy/.conditor/lock.json" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1]))
          assert [s["path"] for s in lock["reviewSignals"]] == ["src/Big.fs"], lock.get("reviewSignals")
          PY

          set +e
          conditor adopt --target "$damaged" --json > "$RUNNER_TEMP/gate-damaged.json"
          status=$?
          set -e
          test "$status" -eq 3
          grep -F "managed-file-modified" "$RUNNER_TEMP/gate-damaged.json"
          test ! -e "$damaged/conditor.json"

  echelon-current-sweep-qualification:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      # echelon-registry main at the echelon-current selection of Praxis 3.7.2,
      # Ordo 1.4.2 and Visual Engineering 1.0.1 (profile 1.1.0).
      REGISTRY_COMMIT: f0e45db563e57b0d69deafaf007a7702ca4bded4
      CURRENT_SET_SHA256: cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Fetch the exact echelon-current resolved set
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/kemiller2002/echelon-registry/$REGISTRY_COMMIT/channels/echelon-current"
          curl -fsSL "$base/linux-x64.json" -o "$RUNNER_TEMP/current.json"
          curl -fsSL "$base/channel.json" -o "$RUNNER_TEMP/channel.json"
          echo "$CURRENT_SET_SHA256  $RUNNER_TEMP/current.json" | sha256sum -c -
          python3 - "$RUNNER_TEMP/channel.json" "$RUNNER_TEMP/current.json" "$CURRENT_SET_SHA256" <<'PY'
          import json, sys
          channel = json.load(open(sys.argv[1]))
          [entry] = [p for p in channel["platforms"] if p["platform"] == "linux-x64"]
          assert entry["sha256"] == sys.argv[3], entry
          selected = {c["systemId"]: c["version"] for c in json.load(open(sys.argv[2]))["components"]}
          expected = {"praxis": "3.7.2", "ordo": "1.4.2", "visual-engineering": "1.0.1",
                      "communication-engineering": "1.0.0", "tutela": "0.1.0"}
          assert all(selected[k] == v for k, v in expected.items()), selected
          PY
      - name: Install exact native Praxis 3.7.2 and Ordo 1.4.2 and check them against the Registry digests
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh -s -- --version 3.7.2
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version 1.4.2
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/praxis" --version | grep -Fx "praxis 3.7.2"
          "$HOME/.echelon/bin/ordo" --version | grep -Fx "1.4.2"
          mkdir -p "$RUNNER_TEMP/artifacts" && cd "$RUNNER_TEMP/artifacts"
          curl -fsSLO https://github.com/kemiller2002/praxis/releases/download/v3.7.2/praxis-linux-x64.tar.gz
          curl -fsSLO https://github.com/kemiller2002/ordo/releases/download/v1.4.2/ordo-linux-x64.tar.gz
          npm pack --silent @echelon-foundry/visual-engineering@1.0.1 > /dev/null
          python3 - "$RUNNER_TEMP/current.json" <<'PY'
          import hashlib, json, sys
          wanted = {"praxis-linux-x64.tar.gz", "ordo-linux-x64.tar.gz", "echelon-foundry-visual-engineering-1.0.1.tgz"}
          for component in json.load(open(sys.argv[1]))["components"]:
              for artifact in component["artifacts"]:
                  if artifact["name"] in wanted:
                      actual = hashlib.sha256(open(artifact["name"], "rb").read()).hexdigest()
                      assert actual == artifact["sha256"], (artifact["name"], actual)
                      wanted.discard(artifact["name"])
          assert not wanted, wanted
          PY
      - name: Install the exact Visual Engineering CLIs
        shell: bash
        run: |
          set -euo pipefail
          npm install --silent --no-save --prefix "$RUNNER_TEMP/ve-1.0.0" @echelon-foundry/visual-engineering@1.0.0
          npm install --silent --no-save --prefix "$RUNNER_TEMP/ve-1.0.1" @echelon-foundry/visual-engineering@1.0.1
          "$RUNNER_TEMP/ve-1.0.0/node_modules/.bin/visual-engineering" --version | grep -Fx "1.0.0"
          "$RUNNER_TEMP/ve-1.0.1/node_modules/.bin/visual-engineering" --version | grep -Fx "1.0.1"
      - name: Sweep order - upgrade VE 1.0.0 to 1.0.1, then adopt against echelon-current
        shell: bash
        run: |
          set -euo pipefail
          conditor() { dotnet run --project src/Conditor.Cli --configuration Release --no-build -- "$@"; }
          ve100="$RUNNER_TEMP/ve-1.0.0/node_modules/.bin/visual-engineering"
          ve101="$RUNNER_TEMP/ve-1.0.1/node_modules/.bin/visual-engineering"
          repo="$RUNNER_TEMP/sweep"
          mkdir -p "$repo" && git -C "$repo" init -q
          git -C "$repo" -c user.name=conditor-ci -c user.email=ci@example.invalid commit -q --allow-empty -m init
          ( cd "$repo" && praxis init && ordo init && "$ve100" init )
          grep -Fx ".visual-engineering/" "$repo/.gitignore"

          # A 1.0.1 CLI reports the 1.0.0 installation stale under --strict.
          set +e
          ( cd "$repo" && "$ve101" verify --strict ) > "$RUNNER_TEMP/ve-stale.txt" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ve-stale.txt"
          test "$status" -ne 0
          grep -F ".gitignore" "$RUNNER_TEMP/ve-stale.txt"

          ( cd "$repo" && "$ve101" upgrade && "$ve101" verify --strict )
          grep -Fx '!.visual-engineering/' "$repo/.gitignore"

          export PATH="$RUNNER_TEMP/ve-1.0.1/node_modules/.bin:$PATH"
          conditor adopt --target "$repo" --resolved-set "$RUNNER_TEMP/current.json" --resolved-set-sha256 "$CURRENT_SET_SHA256" --json > "$RUNNER_TEMP/sweep-adopt.json"
          python3 - "$RUNNER_TEMP/sweep-adopt.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          assert plan["refusals"] == [], plan["refusals"]
          assert sorted((c["id"], c["version"]) for c in plan["components"]) == [
              ("ordo", "1.4.2"), ("praxis", "3.7.2"), ("visual-engineering", "1.0.1")], plan["components"]
          PY
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/sweep-adopt.json")
          conditor adopt --target "$repo" --resolved-set "$RUNNER_TEMP/current.json" --resolved-set-sha256 "$CURRENT_SET_SHA256" --authorize "$digest"
          conditor upgrade --current --check --home "$RUNNER_TEMP/sweep-home" --target "$repo" --resolved-set "$RUNNER_TEMP/current.json" --resolved-set-sha256 "$CURRENT_SET_SHA256" | tee "$RUNNER_TEMP/sweep-current.txt"
          grep -F "version transitions: none" "$RUNNER_TEMP/sweep-current.txt"
          conditor status --target "$repo"
      - name: Sweep to echelon-current 1.2.0 - upgrade --current moves only Ordo 1.4.2 -> 1.5.0
        shell: bash
        env:
          # echelon-registry main at the echelon-current 1.2.0 selection of Ordo 1.5.0
          # (merge 7f7a688). Strata 0.1.0 is optional in 1.2.0 and is not declared here,
          # so --current must not add it.
          NEXT_REGISTRY_COMMIT: 7f7a68844196dda17bfd5a07b30610206c1c8035
          NEXT_SET_SHA256: ea1b39a003d3f2f41c4fb6e979694ec82fd03964854e5dd268e38df51cd22931
        run: |
          set -euo pipefail
          conditor() { dotnet run --project src/Conditor.Cli --configuration Release --no-build -- "$@"; }
          export PATH="$RUNNER_TEMP/ve-1.0.1/node_modules/.bin:$PATH"
          repo="$RUNNER_TEMP/sweep"
          curl -fsSL "https://raw.githubusercontent.com/kemiller2002/echelon-registry/$NEXT_REGISTRY_COMMIT/channels/echelon-current/linux-x64.json" -o "$RUNNER_TEMP/next.json"
          echo "$NEXT_SET_SHA256  $RUNNER_TEMP/next.json" | sha256sum -c -
          next=(--home "$RUNNER_TEMP/sweep-next-home" --target "$repo" --resolved-set "$RUNNER_TEMP/next.json" --resolved-set-sha256 "$NEXT_SET_SHA256")
          conditor upgrade --current --check "${next[@]}" | tee "$RUNNER_TEMP/sweep-next.txt"
          grep -F "Current upgrade plan: echelon-current@1.2.0" "$RUNNER_TEMP/sweep-next.txt"
          grep -F "ordo: 1.4.2 -> 1.5.0 [embedded-qualified-lifecycle]" "$RUNNER_TEMP/sweep-next.txt"
          test "$(grep -c -- ' -> ' "$RUNNER_TEMP/sweep-next.txt")" -eq 2   # the transition and its lifecycle line
          if grep -E "REFUSED|strata" "$RUNNER_TEMP/sweep-next.txt"; then exit 1; fi
          authorization=$(grep -o 'authorize sha256:[0-9a-f]*' "$RUNNER_TEMP/sweep-next.txt" | cut -d' ' -f2)
          conditor upgrade --current "${next[@]}" --authorize "$authorization"
          python3 - "$repo" "$NEXT_SET_SHA256" <<'PY'
          import json, sys, pathlib
          repo, sha = pathlib.Path(sys.argv[1]), sys.argv[2]
          manifest = json.loads((repo / "conditor.json").read_text())
          versions = {c["id"]: c["version"] for c in manifest["components"]}
          assert versions == {"ordo": "1.5.0", "praxis": "3.7.2", "visual-engineering": "1.0.1"}, versions
          assert manifest["registryAuthority"]["sha256"] == sha, manifest
          assert json.loads((repo / ".echelon/toolchain.json").read_text())["ordo"] == "1.5.0"
          assert (repo / ".sde/VERSION").read_text().strip() == "1.5.0"
          PY
          conditor upgrade --current --check "${next[@]}" | grep -F "version transitions: none"
          # The upgrade installed Ordo 1.5.0 into the workstation home and adds its bin
          # directory to future shells through ~/.profile. Status must run with that
          # copy: the Ordo 1.4.2 an earlier step put on PATH correctly refuses a 1.5.0
          # installation with version-mismatch.
          PATH="$RUNNER_TEMP/sweep-next-home/.local/bin:$PATH" conditor status --target "$repo"
      - name: Qualified VE 1.0.0 -> 1.0.1 current-upgrade transition
        shell: bash
        run: |
          set -euo pipefail
          conditor() { dotnet run --project src/Conditor.Cli --configuration Release --no-build -- "$@"; }
          ve100="$RUNNER_TEMP/ve-1.0.0/node_modules/.bin/visual-engineering"
          repo="$RUNNER_TEMP/transition"
          home="$RUNNER_TEMP/transition-home"
          mkdir -p "$repo" "$home" && git -C "$repo" init -q
          git -C "$repo" -c user.name=conditor-ci -c user.email=ci@example.invalid commit -q --allow-empty -m init
          ( cd "$repo" && praxis init && ordo init && "$ve100" init )

          PATH="$RUNNER_TEMP/ve-1.0.0/node_modules/.bin:$PATH" conditor adopt --target "$repo" --json > "$RUNNER_TEMP/transition-adopt.json"
          python3 - "$RUNNER_TEMP/transition-adopt.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          assert plan["refusals"] == [], plan["refusals"]
          assert {"id": "visual-engineering", "version": "1.0.0"} in plan["components"], plan["components"]
          PY
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["digest"])' "$RUNNER_TEMP/transition-adopt.json")
          PATH="$RUNNER_TEMP/ve-1.0.0/node_modules/.bin:$PATH" conditor adopt --target "$repo" --authorize "$digest"

          current=(--home "$home" --target "$repo" --resolved-set "$RUNNER_TEMP/current.json" --resolved-set-sha256 "$CURRENT_SET_SHA256")
          conditor upgrade --current --check "${current[@]}" | tee "$RUNNER_TEMP/transition-plan.txt"
          grep -F "visual-engineering: 1.0.0 -> 1.0.1 [embedded-qualified-package-lifecycle]" "$RUNNER_TEMP/transition-plan.txt"
          grep -F "@echelon-foundry/visual-engineering@1.0.1 (package sha256:32347d5c134f724cb35f9c33d882c2ed51f860381f0d5802634da3da74fb3f2f)" "$RUNNER_TEMP/transition-plan.txt"
          if grep -F "REFUSED" "$RUNNER_TEMP/transition-plan.txt"; then exit 1; fi
          authorization=$(grep -o 'authorize sha256:[0-9a-f]*' "$RUNNER_TEMP/transition-plan.txt" | cut -d' ' -f2)

          conditor upgrade --current "${current[@]}" --authorize "$authorization"
          grep -Fx '!.visual-engineering/' "$repo/.gitignore"
          python3 - "$repo/conditor.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          versions = {c["id"]: c["version"] for c in manifest["components"]}
          assert versions == {"ordo": "1.4.2", "praxis": "3.7.2", "visual-engineering": "1.0.1"}, versions
          assert manifest["registryAuthority"]["sha256"] == "cd8d8d0482c5c4750f4bb31d28bc79e9597d3be4f6264955691e3aebd86cb6d2", manifest
          PY
          conditor upgrade --current --check "${current[@]}" | grep -F "version transitions: none"
          conditor status --target "$repo"
      - name: Sweep to echelon-current 1.16.0 and 1.17.0 - upgrade --current moves only Praxis 3.7.2 -> 3.10.0 -> 3.11.0
        shell: bash
        env:
          # echelon-registry main at echelon-current 1.16.0 (Praxis 3.10.0, merge 616d10e)
          # and 1.17.0 (Praxis 3.11.0, merge 50c6c96). Praxis releases declare no
          # echelon.repository-lifecycle contract, so each exact version must be
          # qualified by components/praxis.component.json; Arca, Strata and the other
          # systems these sets select are not declared here, so --current must not add them.
          SET_116_COMMIT: 616d10e5ba6d568632b7662194fac1c99c0e2880
          SET_116_SHA256: ddcaad58026f370f99703515a5ac497ed1683b7d593efacead4bec3f244aad44
          SET_117_COMMIT: 50c6c96e6a1af6febb67beec8edd52b95927501e
          SET_117_SHA256: 94b37048d25a7c8ef67b9470f8ab66d529d52a5152baeeae6d6e1ca72df95ec4
        run: |
          set -euo pipefail
          conditor() { dotnet run --project src/Conditor.Cli --configuration Release --no-build -- "$@"; }
          export PATH="$RUNNER_TEMP/ve-1.0.1/node_modules/.bin:$PATH"
          repo="$RUNNER_TEMP/sweep"
          home="$RUNNER_TEMP/sweep-next-home"
          sweep() {
            local profile="$1" commit="$2" sha="$3" from="$4" to="$5"
            local set="$RUNNER_TEMP/set-$profile.json" plan="$RUNNER_TEMP/sweep-$profile.txt"
            curl -fsSL "https://raw.githubusercontent.com/kemiller2002/echelon-registry/$commit/channels/echelon-current/linux-x64.json" -o "$set"
            echo "$sha  $set" | sha256sum -c -
            local args=(--home "$home" --target "$repo" --resolved-set "$set" --resolved-set-sha256 "$sha")
            conditor upgrade --current --check "${args[@]}" | tee "$plan"
            grep -F "Current upgrade plan: echelon-current@$profile" "$plan"
            grep -F "praxis: $from -> $to [embedded-qualified-lifecycle]" "$plan"
            test "$(grep -c -- ' -> ' "$plan")" -eq 2   # the transition and its lifecycle line
            if grep -E "REFUSED|arca|strata" "$plan"; then exit 1; fi
            local authorization
            authorization=$(grep -o 'authorize sha256:[0-9a-f]*' "$plan" | cut -d' ' -f2)
            conditor upgrade --current "${args[@]}" --authorize "$authorization"
            python3 - "$repo" "$sha" "$to" <<'PY'
          import json, sys, pathlib
          repo, sha, praxis = pathlib.Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          manifest = json.loads((repo / "conditor.json").read_text())
          versions = {c["id"]: c["version"] for c in manifest["components"]}
          assert versions == {"ordo": "1.5.0", "praxis": praxis, "visual-engineering": "1.0.1"}, versions
          assert manifest["registryAuthority"]["sha256"] == sha, manifest
          assert json.loads((repo / ".echelon/toolchain.json").read_text())["praxis"] == praxis
          PY
            conditor upgrade --current --check "${args[@]}" | grep -F "version transitions: none"
            "$home/.local/bin/praxis" --version | grep -Fx "praxis $to"
            PATH="$home/.local/bin:$PATH" conditor status --target "$repo"
            git -C "$repo" add -A
            git -C "$repo" -c user.name=conditor-ci -c user.email=ci@example.invalid commit -q -m "echelon-current $profile"
          }
          sweep 1.16.0 "$SET_116_COMMIT" "$SET_116_SHA256" 3.7.2 3.10.0
          sweep 1.17.0 "$SET_117_COMMIT" "$SET_117_SHA256" 3.10.0 3.11.0

  host-tool-upgrade-boundary:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

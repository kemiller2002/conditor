name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Conditor.Tests --configuration Release --no-build
      - name: CLI plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- presets
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset clean-room --target "$RUNNER_TEMP/conditor-plan"
      - name: Indy Init preset plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-indy-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset indy-init --target "$RUNNER_TEMP/conditor-indy-plan"

  empty-repository-smoke:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Create empty target
        run: mkdir -p "$RUNNER_TEMP/conditor-empty"
      - name: Initialize empty target from embedded preset
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- init --preset clean-room --target "$RUNNER_TEMP/conditor-empty"
      - name: Verify established project
        run: |
          test -f "$RUNNER_TEMP/conditor-empty/conditor.json"
          test -f "$RUNNER_TEMP/conditor-empty/.conditor/lock.json"
          test -f "$RUNNER_TEMP/conditor-empty/src/engine/App.Engine.fsproj"
          test -f "$RUNNER_TEMP/conditor-empty/src/engine/Domain.fs"
          test -f "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          test -f "$RUNNER_TEMP/conditor-empty/src/kernel/bootstrap.ts"
          grep -F "@echelon-foundry/design-system" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "@echelon-foundry/print-components" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "@echelon-foundry/typescript-wasm-kernel" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "EchelonFoundry.Aegis.Core" "$RUNNER_TEMP/conditor-empty/src/engine/App.Engine.fsproj"
          test -f "$RUNNER_TEMP/conditor-empty/requirements/contract.md"
          test -f "$RUNNER_TEMP/conditor-empty/SDE-MAP.md"
          test -f "$RUNNER_TEMP/conditor-empty/context/CURRENT-STATE.md"
          grep -F "requirements/contract.md" "$RUNNER_TEMP/conditor-empty/SDE-MAP.md"
          grep -F "Application domain concepts have not yet been derived" "$RUNNER_TEMP/conditor-empty/context/CURRENT-STATE.md"
          test -f "$RUNNER_TEMP/conditor-empty/AGENTS.md"
          test -f "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          grep -F "requirements/contract.md" "$RUNNER_TEMP/conditor-empty/AGENTS.md"
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          grep -F '"status": "ready"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
      - name: Inspect Conditor status
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
      - name: Reconcile established project
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- repair --target "$RUNNER_TEMP/conditor-empty"
      - name: Re-check Conditor status after repair
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
      - name: Exercise no-op lifecycle upgrade
        run: |
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- upgrade --target "$RUNNER_TEMP/conditor-empty"
          grep -F '"schemaVersion": 2' "$RUNNER_TEMP/conditor-empty/.conditor/lock.json"
      - name: Re-check Conditor status after upgrade
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
      - name: Install fake Codex adapter
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/codex" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codex-test 1.0"
            exit 0
          fi
          if [[ "${1:-}" == "login" && "${2:-}" == "status" ]]; then
            echo "Logged in for Conditor CI"
            exit 0
          fi
          if [[ "${1:-}" == "exec" && "${2:-}" == "--full-auto" ]]; then
            echo "fake Codex execution accepted"
            exit 0
          fi
          echo "unexpected fake codex invocation: $*" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/codex"
          cat > "$RUNNER_TEMP/fake-bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "claude-test 1.0"
            exit 0
          fi
          if [[ "${1:-}" == "auth" && "${2:-}" == "status" ]]; then
            echo "authenticated"
            exit 0
          fi
          if [[ "${1:-}" == "-p" ]]; then
            echo "fake Claude execution accepted"
            exit 0
          fi
          echo "unexpected fake claude invocation: $*" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/claude"
      - name: Check execution readiness
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --check --target "$RUNNER_TEMP/conditor-empty"
      - name: Check Claude launcher override
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --check --launcher claude --target "$RUNNER_TEMP/conditor-empty"
      - name: Start through fake Codex adapter
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --target "$RUNNER_TEMP/conditor-empty"
      - name: Verify execution handoff remains Praxis-owned
        run: |
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          test -f "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"
          grep -F '"semanticState": "active"' "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"

  native-cli-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - name: Publish self-contained Conditor
        run: >
          dotnet publish src/Conditor.Cli/Conditor.Cli.fsproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:PublishTrimmed=false
          --output "$RUNNER_TEMP/conditor-native"
      - name: Run native Conditor
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-native-target"
          chmod +x "$RUNNER_TEMP/conditor-native/conditor"
          "$RUNNER_TEMP/conditor-native/conditor" presets
          "$RUNNER_TEMP/conditor-native/conditor" plan --preset clean-room --target "$RUNNER_TEMP/conditor-native-target"


  factory-rehearsal-smoke:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Run sacrificial factory rehearsal
        run: bash scripts/rehearse-clean-room.sh "$RUNNER_TEMP/evidence-triage-rehearsal"
      - name: Inspect rehearsal output
        run: |
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/AGENTS.md"
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/kickoff/evidence-triage.kickoff.json"
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/.conditor/lock.json"
          grep -F "Canonical execution contract" "$RUNNER_TEMP/evidence-triage-rehearsal/AGENTS.md"

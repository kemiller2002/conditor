name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: conditor-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Conditor.Tests --configuration Release --no-build
      - name: CLI plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- presets
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- components
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- components --json > "$RUNNER_TEMP/conditor-components.json"
          grep -F '"id": "praxis"' "$RUNNER_TEMP/conditor-components.json"
          grep -F '"id": "tutela"' "$RUNNER_TEMP/conditor-components.json"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- compatibility
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- compatibility --json > "$RUNNER_TEMP/conditor-compatibility.json"
          grep -F '"schemaVersion": 1' "$RUNNER_TEMP/conditor-compatibility.json"
          grep -F '"id": "praxis"' "$RUNNER_TEMP/conditor-compatibility.json"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset clean-room --target "$RUNNER_TEMP/conditor-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- workstation plan --profile echelon-engineering --home "$RUNNER_TEMP/workstation-plan-home"
          test -z "$(ls -A "$RUNNER_TEMP/workstation-plan-home" 2>/dev/null)"
      - name: Indy Init preset plan smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-indy-plan"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- plan --preset indy-init --target "$RUNNER_TEMP/conditor-indy-plan"

  host-tool-upgrade-boundary:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Install exact native Echelon host tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh -s -- --version 3.6.0
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version 1.4.0
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/praxis" --version
          "$HOME/.echelon/bin/ordo" --version
      - name: Establish current native lifecycle declaration
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-upgrade"
          cp examples/current-lifecycle-upgrade-rehearsal.conditor.json "$RUNNER_TEMP/conditor-upgrade/conditor.json"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- init --target "$RUNNER_TEMP/conditor-upgrade"
      - name: Refuse repository-only host-tool version change
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/"version": "3.6.0"/"version": "3.1.4"/' "$RUNNER_TEMP/conditor-upgrade/conditor.json"
          if dotnet run --project src/Conditor.Cli --configuration Release --no-build -- upgrade --check --target "$RUNNER_TEMP/conditor-upgrade" >"$RUNNER_TEMP/host-upgrade.txt" 2>&1; then
            echo "repository-only Praxis host-tool downgrade unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F "native host tool" "$RUNNER_TEMP/host-upgrade.txt"

  current-lifecycle-qualification:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Install exact native Echelon host tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh -s -- --version 3.6.0
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version 1.4.0
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/praxis" --version
          "$HOME/.echelon/bin/ordo" --version
      - name: Qualify current native lifecycle releases
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-current"
          cp examples/current-lifecycle-upgrade-rehearsal.conditor.json "$RUNNER_TEMP/conditor-current/conditor.json"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- init --target "$RUNNER_TEMP/conditor-current"
          "$HOME/.echelon/bin/praxis" --version | grep -F "3.6.0"
          "$HOME/.echelon/bin/ordo" --version | grep -F "1.4.0"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-current"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- doctor --json --target "$RUNNER_TEMP/conditor-current" > "$RUNNER_TEMP/current-lifecycle-doctor.json"
          grep -F '"healthy": true' "$RUNNER_TEMP/current-lifecycle-doctor.json"

  empty-repository-smoke:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Install exact native Echelon host tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh -s -- --version 3.6.0
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version 1.4.0
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/praxis" --version
          "$HOME/.echelon/bin/ordo" --version
      - name: Create empty target
        run: mkdir -p "$RUNNER_TEMP/conditor-empty"
      - name: Initialize empty target from embedded preset
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- init --preset clean-room --target "$RUNNER_TEMP/conditor-empty"
      - name: Verify established project
        run: |
          test -f "$RUNNER_TEMP/conditor-empty/conditor.json"
          test -f "$RUNNER_TEMP/conditor-empty/.conditor/lock.json"
          test -f "$RUNNER_TEMP/conditor-empty/src/engine/App.Engine.fsproj"
          test -f "$RUNNER_TEMP/conditor-empty/src/engine/Domain.fs"
          test -f "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          test -f "$RUNNER_TEMP/conditor-empty/src/kernel/bootstrap.ts"
          grep -F "@echelon-foundry/design-system" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "@echelon-foundry/print-components" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "@echelon-foundry/typescript-wasm-kernel" "$RUNNER_TEMP/conditor-empty/src/kernel/package.json"
          grep -F "EchelonFoundry.Aegis.Core" "$RUNNER_TEMP/conditor-empty/src/engine/App.Engine.fsproj"
          test -f "$RUNNER_TEMP/conditor-empty/requirements/contract.md"
          test -f "$RUNNER_TEMP/conditor-empty/SDE-MAP.md"
          test -f "$RUNNER_TEMP/conditor-empty/context/CURRENT-STATE.md"
          grep -F "requirements/contract.md" "$RUNNER_TEMP/conditor-empty/SDE-MAP.md"
          grep -F "Application domain concepts have not yet been derived" "$RUNNER_TEMP/conditor-empty/context/CURRENT-STATE.md"
          test -f "$RUNNER_TEMP/conditor-empty/AGENTS.md"
          test -f "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          grep -F "requirements/contract.md" "$RUNNER_TEMP/conditor-empty/AGENTS.md"
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          grep -F '"status": "ready"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
      - name: Inspect Conditor status
        run: |
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --json --target "$RUNNER_TEMP/conditor-empty" > "$RUNNER_TEMP/conditor-status.json"
          grep -F '"healthy": true' "$RUNNER_TEMP/conditor-status.json"
          grep -F '"schemaVersion": 1' "$RUNNER_TEMP/conditor-status.json"
      - name: Diagnose established project
        run: |
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- doctor --target "$RUNNER_TEMP/conditor-empty"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- doctor --json --target "$RUNNER_TEMP/conditor-empty" > "$RUNNER_TEMP/conditor-doctor.json"
          grep -F '"healthy": true' "$RUNNER_TEMP/conditor-doctor.json"
          grep -F '"code": "COND-DOC-LOCK"' "$RUNNER_TEMP/conditor-doctor.json"
      - name: Reconcile established project
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- repair --target "$RUNNER_TEMP/conditor-empty"
      - name: Re-check Conditor status after repair
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
      - name: Exercise no-op lifecycle upgrade
        run: |
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- upgrade --target "$RUNNER_TEMP/conditor-empty"
          grep -F '"schemaVersion": 3' "$RUNNER_TEMP/conditor-empty/.conditor/lock.json"
      - name: Re-check Conditor status after upgrade
        run: dotnet run --project src/Conditor.Cli --configuration Release --no-build -- status --target "$RUNNER_TEMP/conditor-empty"
      - name: Install fake Codex adapter
        run: |
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/codex" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "codex-test 1.0"
            exit 0
          fi
          if [[ "${1:-}" == "login" && "${2:-}" == "status" ]]; then
            if [[ -n "${OPENAI_FEDERATION_RULE_ID:-}" || -n "${OPENAI_IDENTITY_TOKEN_FILE:-}" ]]; then
              echo "login status must not consume a WIF assertion during Conditor readiness" >&2
              exit 91
            fi
            echo "Logged in for Conditor CI"
            exit 0
          fi
          if [[ "${1:-}" == "exec" && "${2:-}" == "--full-auto" ]]; then
            echo "fake Codex execution accepted"
            exit 0
          fi
          echo "unexpected fake codex invocation: $*" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/codex"
          cat > "$RUNNER_TEMP/fake-bin/claude" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == "--version" ]]; then
            echo "claude-test 1.0"
            exit 0
          fi
          if [[ "${1:-}" == "auth" && "${2:-}" == "status" ]]; then
            echo "authenticated"
            exit 0
          fi
          if [[ "${1:-}" == "-p" ]]; then
            echo "fake Claude execution accepted"
            exit 0
          fi
          echo "unexpected fake claude invocation: $*" >&2
          exit 2
          EOF
          chmod +x "$RUNNER_TEMP/fake-bin/claude"
      - name: Check execution readiness
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --check --target "$RUNNER_TEMP/conditor-empty"
      - name: Check Codex workload identity readiness without consuming assertion
        run: |
          mkdir -p "$RUNNER_TEMP/openai-wif"
          chmod 700 "$RUNNER_TEMP/openai-wif"
          printf '%s\n' 'fake-github-oidc-jwt' > "$RUNNER_TEMP/openai-wif/identity-token"
          chmod 600 "$RUNNER_TEMP/openai-wif/identity-token"
          PATH="$RUNNER_TEMP/fake-bin:$PATH" \
          OPENAI_FEDERATION_RULE_ID="idpm_conditor_ci" \
          OPENAI_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/openai-wif/identity-token" \
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --check --target "$RUNNER_TEMP/conditor-empty"
      - name: Check Claude launcher override
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --check --launcher claude --target "$RUNNER_TEMP/conditor-empty"
      - name: Rehearse external Claude provider handoff
        run: |
          handoff_target="$RUNNER_TEMP/conditor-handoff"
          cp -a "$RUNNER_TEMP/conditor-empty" "$handoff_target"
          prompt_path="$RUNNER_TEMP/claude-handoff-prompt.txt"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            handoff \
            --launcher claude \
            --target "$handoff_target" \
            --prompt-file "$prompt_path"

          test -f "$prompt_path"
          grep -F 'COND-MISSION-001' "$prompt_path"
          grep -F 'canonical execution contract' "$prompt_path"
          grep -F '"semanticState": "active"' "$handoff_target/.ros/context/current.json"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            handoff \
            --resume \
            --launcher claude \
            --target "$handoff_target" \
            --prompt-file "$RUNNER_TEMP/claude-resume-prompt.txt"

          grep -F '"semanticState": "active"' "$handoff_target/.ros/context/current.json"
      - name: Refuse resume before mission activation
        run: |
          if PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- resume --launcher claude --target "$RUNNER_TEMP/conditor-empty"; then
            echo "resume unexpectedly activated a ready mission" >&2
            exit 1
          fi
          grep -F '"status": "ready"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
      - name: Start through fake Codex adapter
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- start --target "$RUNNER_TEMP/conditor-empty"
      - name: Verify execution handoff remains Praxis-owned
        run: |
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/work/queue.json"
          test -f "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"
          grep -F '"id": "COND-MISSION-001"' "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"
          grep -F '"semanticState": "active"' "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"
      - name: Resume active mission through Claude override
        run: PATH="$RUNNER_TEMP/fake-bin:$PATH" dotnet run --project src/Conditor.Cli --configuration Release --no-build -- resume --launcher claude --target "$RUNNER_TEMP/conditor-empty"
      - name: Verify resume preserves Praxis active state
        run: |
          grep -F '"semanticState": "active"' "$RUNNER_TEMP/conditor-empty/.ros/context/current.json"

  native-cli-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - name: Publish self-contained Conditor
        run: >
          dotnet publish src/Conditor.Cli/Conditor.Cli.fsproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:PublishTrimmed=false
          --output "$RUNNER_TEMP/conditor-native"
      - name: Run native Conditor
        run: |
          mkdir -p "$RUNNER_TEMP/conditor-native-target"
          chmod +x "$RUNNER_TEMP/conditor-native/conditor"
          "$RUNNER_TEMP/conditor-native/conditor" presets
          "$RUNNER_TEMP/conditor-native/conditor" components
          "$RUNNER_TEMP/conditor-native/conditor" compatibility
          "$RUNNER_TEMP/conditor-native/conditor" plan --preset clean-room --target "$RUNNER_TEMP/conditor-native-target"
      - name: Validate bootstrap script syntax
        run: |
          sh -n scripts/install.sh
          pwsh -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw scripts/install.ps1))'
      - name: Rehearse one-line Unix bootstrap from local release mirror
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/bootstrap-release"
          home="$RUNNER_TEMP/bootstrap-home"
          install="$home/bin"
          mkdir -p "$release" "$home"

          cp "$RUNNER_TEMP/conditor-native/conditor" "$release/conditor-linux-x64"
          chmod +x "$release/conditor-linux-x64"
          (cd "$release" && sha256sum conditor-linux-x64 > checksums.txt)

          HOME="$home" \
          SHELL=/bin/bash \
          CONDITOR_RELEASE_BASE="file://$release" \
          CONDITOR_INSTALL_DIR="$install" \
          sh scripts/install.sh presets > "$RUNNER_TEMP/bootstrap-first.txt"

          test -x "$install/conditor"
          grep -F "Built-in Conditor presets:" "$RUNNER_TEMP/bootstrap-first.txt"
          grep -F '# >>> conditor:path >>>' "$home/.profile"
          test "$(grep -c '# >>> conditor:path >>>' "$home/.profile")" -eq 1

          HOME="$home" \
          SHELL=/bin/bash \
          CONDITOR_RELEASE_BASE="file://$release" \
          CONDITOR_INSTALL_DIR="$install" \
          sh scripts/install.sh components > "$RUNNER_TEMP/bootstrap-second.txt"

          grep -F "Conditor components:" "$RUNNER_TEMP/bootstrap-second.txt"
          test "$(grep -c '# >>> conditor:path >>>' "$home/.profile")" -eq 1
      - name: Refuse tampered bootstrap artifact without replacing installed Conditor
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/bootstrap-release"
          home="$RUNNER_TEMP/bootstrap-home"
          install="$home/bin"
          before="$("$install/conditor" presets | sha256sum | awk '{print $1}')"

          printf 'tampered\n' > "$release/conditor-linux-x64"

          if HOME="$home" SHELL=/bin/bash CONDITOR_RELEASE_BASE="file://$release" CONDITOR_INSTALL_DIR="$install" sh scripts/install.sh presets; then
            echo "tampered bootstrap unexpectedly succeeded" >&2
            exit 1
          fi

          after="$("$install/conditor" presets | sha256sum | awk '{print $1}')"
          test "$before" = "$after"


  indy-init-offline-freeze:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out frozen Registry authority
        uses: actions/checkout@v4
        with:
          repository: kemiller2002/echelon-registry
          ref: c174b8937b9ad3f543a020f737db4eca5fad6317
          path: registry-freeze

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore

      - name: Regenerate frozen Linux release set
        shell: bash
        run: |
          set -euo pipefail
          dotnet fsi registry-freeze/tools/resolve-profile.fsx -- \
            --profile registry-freeze/profiles/indy-init.profile.json \
            --snapshot registry-freeze/snapshots/indy-init-0.1.0.catalog.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/indy-init-linux-x64.json"

          observed="$(sha256sum "$RUNNER_TEMP/indy-init-linux-x64.json" | awk '{print $1}')"
          expected="3ac237804c546244499619aa88803fd280de6bb3a5daec205ccf730f61be5b40"
          test "$observed" = "$expected"

      - name: Create and verify exact offline bundle
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            bundle create \
            --resolved-set "$RUNNER_TEMP/indy-init-linux-x64.json" \
            --resolved-set-sha256 3ac237804c546244499619aa88803fd280de6bb3a5daec205ccf730f61be5b40 \
            --manifest examples/indy-init.conditor.json \
            --output "$RUNNER_TEMP/indy-init-bundle"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            bundle verify --path "$RUNNER_TEMP/indy-init-bundle"

          test -f "$RUNNER_TEMP/indy-init-bundle/packages/aegis/EchelonFoundry.Aegis.Core.1.0.0.nupkg"
          test -f "$RUNNER_TEMP/indy-init-bundle/packages/limen/echelon-foundry-typescript-wasm-kernel-0.6.2.tgz"
          test -f "$RUNNER_TEMP/indy-init-bundle/packages/forma/echelon-foundry-design-system-0.3.0.tgz"
          test -f "$RUNNER_TEMP/indy-init-bundle/packages/folio/echelon-foundry-print-components-0.3.0.tgz"
          test -f "$RUNNER_TEMP/indy-init-bundle/project/conditor.json"
          test -f "$RUNNER_TEMP/indy-init-bundle/sources/kemiller2002_Indy-init/b2c67e5e3bf410a6acf0065f897588aa949a0663/kickoff/indy-init.kickoff.json"
          test -f "$RUNNER_TEMP/indy-init-bundle/sources/kemiller2002_percepta/9e6307734f5ae03f98155bdd0588fee13d701b50/examples/indy-init/application.json"

      - name: Plan frozen workstation from bundled resolved set
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/indy-init-home"
          mkdir -p "$home"
          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            workstation plan \
            --resolved-set "$RUNNER_TEMP/indy-init-bundle/resolved-set.json" \
            --resolved-set-sha256 3ac237804c546244499619aa88803fd280de6bb3a5daec205ccf730f61be5b40 \
            --home "$home" \
            --json > "$RUNNER_TEMP/indy-init-plan.json"

          python3 - "$RUNNER_TEMP/indy-init-plan.json" "$RUNNER_TEMP/indy-init-plan.digest" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1]))
          digest = plan.get("digest")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("workstation plan did not emit a digest")
          open(sys.argv[2], "w").write(digest)
          PY

      - name: Apply workstation with network fallback forbidden
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/indy-init-home"
          digest="$(cat "$RUNNER_TEMP/indy-init-plan.digest")"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            workstation apply \
            --resolved-set "$RUNNER_TEMP/indy-init-bundle/resolved-set.json" \
            --resolved-set-sha256 3ac237804c546244499619aa88803fd280de6bb3a5daec205ccf730f61be5b40 \
            --artifact-mirror "$RUNNER_TEMP/indy-init-bundle/mirror" \
            --offline \
            --home "$home" \
            --authorize "$digest"

          "$home/.local/bin/praxis" --version | grep -F "3.6.0"
          "$home/.local/bin/ordo" --version | grep -F "1.4.0"
          "$home/.local/bin/percepta-repo" --version | grep -F "0.1.0"

          test ! -e "$home/.local/bin/aegis"
          test ! -e "$home/.local/bin/limen"
          test ! -e "$home/.local/bin/forma"
          test ! -e "$home/.local/bin/folio"

      - name: Initialize frozen Indy Init project from bundle sources only
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/indy-init-home"
          target="$RUNNER_TEMP/indy-init-project"
          cache="$RUNNER_TEMP/indy-init-empty-source-cache"
          mkdir -p "$target" "$cache"
          export PATH="$home/.local/bin:$PATH"
          export CONDITOR_CACHE_DIR="$cache"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            init \
            --manifest "$RUNNER_TEMP/indy-init-bundle/project/conditor.json" \
            --target "$target" \
            --source-mirror "$RUNNER_TEMP/indy-init-bundle/sources" \
            --offline

          test -f "$target/docs/PRODUCT-REQUIREMENTS.md"
          test -f "$target/.percepta/application.json"
          test -f "$target/.percepta/contracts/s25-demo-health.json"
          test -f "$target/package.json"
          test -f "$target/.conditor/lock.json"

          dotnet run --project src/Conditor.Cli --configuration Release --no-build -- \
            verify \
            --manifest "$RUNNER_TEMP/indy-init-bundle/project/conditor.json" \
            --target "$target" \
            --source-mirror "$RUNNER_TEMP/indy-init-bundle/sources" \
            --offline

  factory-rehearsal-smoke:
    if: github.event_name == 'push'
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - name: Install exact native Echelon host tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/praxis/main/scripts/install-native.sh | sh -s -- --version 3.6.0
          curl -fsSL https://raw.githubusercontent.com/kemiller2002/ordo/main/scripts/install-native.sh | sh -s -- --version 1.4.0
          echo "$HOME/.echelon/bin" >> "$GITHUB_PATH"
          "$HOME/.echelon/bin/praxis" --version
          "$HOME/.echelon/bin/ordo" --version
      - name: Run sacrificial factory rehearsal
        run: bash scripts/rehearse-clean-room.sh "$RUNNER_TEMP/evidence-triage-rehearsal"
      - name: Inspect rehearsal output
        run: |
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/AGENTS.md"
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/kickoff/evidence-triage.kickoff.json"
          test -f "$RUNNER_TEMP/evidence-triage-rehearsal/.conditor/lock.json"
          grep -F "Canonical execution contract" "$RUNNER_TEMP/evidence-triage-rehearsal/AGENTS.md"

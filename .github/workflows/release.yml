name: release

on:
  push:
    tags:
      - "v*"
  # The operator orchestrator (release-orchestrator.yml) dispatches this
  # workflow on the new tag: a tag pushed with GITHUB_TOKEN does not trigger
  # the push event.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Conditor.slnx
      - run: dotnet build Conditor.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Conditor.Tests --configuration Release --no-build

  publish:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        rid:
          - linux-x64
          - linux-arm64
          - linux-musl-x64
          - linux-musl-arm64
          - osx-x64
          - osx-arm64
          - win-x64
          - win-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Validate tag matches project version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -F "<Version>$VERSION</Version>" Directory.Build.props
      - name: Publish
        shell: bash
        run: |
          RID="${{ matrix.rid }}"
          dotnet publish src/Conditor.Cli/Conditor.Cli.fsproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:DebugType=None \
            -p:PublishTrimmed=false \
            --output "$RUNNER_TEMP/publish"

          mkdir -p "$RUNNER_TEMP/asset"
          if [[ "$RID" == win-* ]]; then
            cp "$RUNNER_TEMP/publish/conditor.exe" "$RUNNER_TEMP/asset/conditor-$RID.exe"
          else
            cp "$RUNNER_TEMP/publish/conditor" "$RUNNER_TEMP/asset/conditor-$RID"
            chmod +x "$RUNNER_TEMP/asset/conditor-$RID"
          fi
      - name: Attest binary provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ runner.temp }}/asset/*
      - uses: actions/upload-artifact@v4
        with:
          name: conditor-${{ matrix.rid }}
          path: ${{ runner.temp }}/asset/*
          if-no-files-found: error

  release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: conditor-*
          path: assets
          merge-multiple: true
      - name: Verify binary provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in assets/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Create checksums
        run: |
          (cd assets && sha256sum *) > checksums.txt
          cp checksums.txt assets/checksums.txt
          cat checksums.txt
      - name: Resolve release variables
        id: release-vars
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Generate shared Echelon release manifest
        uses: kemiller2002/echelon-registry/actions/release-contract@73d1e87fe40c703eb1cd5e7cf7caf9d852f788b9
        with:
          release-input: release/echelon.release-input.json
          artifact-dir: assets
          output: echelon-release.json
          version: ${{ steps.release-vars.outputs.version }}
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          release-stage: stable
      - name: Inspect generated release manifest
        run: python3 -m json.tool echelon-release.json
      - name: Create GitHub release (immutable per version)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Idempotent rerun: accept only byte-identical artifacts.
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir published
            if cmp -s published/checksums.txt checksums.txt; then
              echo "Release $GITHUB_REF_NAME already published with identical artifacts."
              exit 0
            fi
            echo "::error::Release $GITHUB_REF_NAME exists with different artifacts; refusing to overwrite an immutable version."
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            assets/* \
            echelon-release.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Conditor $GITHUB_REF_NAME" \
            --generate-notes
      - name: Smoke-test the released artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern conditor-linux-x64 --dir smoke
          chmod +x smoke/conditor-linux-x64
          (cd smoke && sha256sum -c <(grep ' conditor-linux-x64$' ../checksums.txt))
          smoke/conditor-linux-x64 presets
          smoke/conditor-linux-x64 workstation plan --profile minimal --home "$RUNNER_TEMP/smoke-home"
